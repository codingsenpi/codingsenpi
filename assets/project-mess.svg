<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="100%" height="auto">
  <defs>
    <pattern id="grid-mess" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#fab3a9" fill-opacity="0.1" />
    </pattern>
  </defs>
  <style>
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 19px; fill: #ffffff; letter-spacing: 0.5px; }
    .card-subtitle { font-family: ui-monospace, 'SF Mono', monospace; font-size: 13.5px; font-weight: 700; fill: #7fb285; letter-spacing: 0.5px; }
    .card-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #c6ad94; }
    .badge-txt { font-family: ui-monospace, 'SF Mono', monospace; font-size: 11.5px; font-weight: 700; fill: #7fb285; letter-spacing: 0.5px; }
    .tag-txt { font-family: ui-monospace, 'SF Mono', monospace; font-size: 12px; font-weight: 700; }
  </style>

  <!-- Offset Shadow -->
  <rect x="8" y="8" width="406" height="226" rx="4" fill="#7fb285" />

  <!-- Main Card -->
  <rect x="4" y="4" width="406" height="226" rx="4" fill="#3b272f" stroke="#fab3a9" stroke-width="2.5" />

  <!-- Grid -->
  <rect x="6" y="6" width="402" height="222" rx="3" fill="url(#grid-mess)" />

  <!-- Header row: Title on Left, Badge on Far Right -->
  <circle cx="24" cy="30" r="5" fill="#7fb285" />
  <text x="36" y="36" class="card-title">MESS PORTAL</text>
  
  <!-- Top-Right Badge: CAMPUS PWA -->
  <rect x="260" y="18" width="130" height="26" rx="3" fill="#2d1b22" stroke="#7fb285" stroke-width="1.5" />
  <text x="325" y="35" class="badge-txt" text-anchor="middle">CAMPUS PWA</text>

  <!-- Subtitle -->
  <text x="20" y="72" class="card-subtitle">FLUTTER WEB // IIIT KOTA</text>

  <!-- Description -->
  <text x="20" y="100" class="card-desc">Unofficial progressive web app for campus mess,</text>
  <text x="20" y="121" class="card-desc">providing students with an accessible, real-time interface</text>
  <text x="20" y="142" class="card-desc">to view weekly menus and daily dining schedules.</text>

  <!-- Tags Row -->
  <g transform="translate(20, 175)">
    <!-- Tag 1: Flutter Web -->
    <rect x="0" y="0" width="94" height="28" rx="3" fill="#2d1b22" stroke="#7fb285" stroke-width="1.5" />
    <text x="47" y="18" class="tag-txt" fill="#7fb285" text-anchor="middle">Flutter Web</text>

    <!-- Tag 2: Dart -->
    <rect x="102" y="0" width="56" height="28" rx="3" fill="#2d1b22" stroke="#fab3a9" stroke-width="1.5" />
    <text x="130" y="18" class="tag-txt" fill="#fab3a9" text-anchor="middle">Dart</text>

    <!-- Tag 3: PWA -->
    <rect x="166" y="0" width="56" height="28" rx="3" fill="#2d1b22" stroke="#ed6b86" stroke-width="1.5" />
    <text x="194" y="18" class="tag-txt" fill="#ed6b86" text-anchor="middle">PWA</text>

    <!-- Tag 4: IIIT Kota -->
    <rect x="230" y="0" width="86" height="28" rx="3" fill="#2d1b22" stroke="#c6ad94" stroke-width="1.5" />
    <text x="273" y="18" class="tag-txt" fill="#c6ad94" text-anchor="middle">IIIT Kota</text>
  </g>
</svg>
